# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '$(DOCKER_REG_SERVICE_CONNECTION)'
  imageRepository: '$(IMAGE_REPOSITORY)'
  containerRegistry: '$(CONTAINER_REGISTRY)'
  dockerfilePath: '$(Build.SourcesDirectory)'
  dockerfileName: '$(DOCKERFILE_NAME)'
  tag: '$(Build.BuildId)'
  azureSubscription: '$(AZURE_SUBSCRIPTION)'
  appName: '$(APP_NAME)'
  agentPool: '$(AGENT_POOL)'
  keyVaultName: '$(KEY_VAULT_NAME)'
  acrPassword: '$(ACR_PASSWORD)'

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool: $(agentPool)
        steps:

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: '*'
              RunAsPreJob: false

          - script: |
              echo -n "$mySecret" | sha256sum
            env:
              mySecret: $(storage-account)
            displayName: 'Display Secret Value 1'

          - script: |
              echo -n "$mySecret" | sha256sum
            env:
              mySecret: $(db-password)
            displayName: 'Display Secret Value 2'

          - task: CmdLine@2
            inputs:
              script: 'echo $(db-password) > db_password.txt'

          - task: CopyFiles@2
            inputs:
              Contents: db_password.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(storage-account) > storage_account.txt'

          - task: CopyFiles@2
            inputs:
              Contents: storage_account.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(crossref-password) > crossref_password.txt'

          - task: CopyFiles@2
            inputs:
              Contents: crossref_password.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(crossref-email) > crossref_email.txt'

          - task: CopyFiles@2
            inputs:
              Contents: crossref_email.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - script: |
              echo "Listing files in the current directory:"
              ls -al
            displayName: 'Verify file creation'

          - script: |
              echo "Contents of secret file:"
              cat storage_account.txt
            displayName: 'Display value1'

          - script: |
              echo "Contents of secret file:"
              cat db_password.txt
            displayName: 'Display value2'

          - task: Docker@2
            displayName: Build
            inputs:
              command: 'build'
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              Dockerfile: $(dockerfilePath)/$(dockerfileName)
              tags: $(tag)

          - task: Docker@2
            displayName: Push
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: $(tag)

          - task: AzureCLI@2
            displayName: 'Deploy container to Azure Web App'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp config container set \
                  --resource-group rg-cmss-ostr-nonprod-ca-cn \
                  --name $(appName) \
                  --docker-custom-image-name ostrnonprodcr.azurecr.io/dspacebackend:$(tag) \
                  --docker-registry-server-url https://ostrnonprodcr.azurecr.io \
                  --docker-registry-server-user ostrnonprodcr \
                  --docker-registry-server-password $(acrPassword)
              failOnStandardError: false