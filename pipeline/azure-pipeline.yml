# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '$(DOCKER_REG_SERVICE_CONNECTION)'
  imageRepository: '$(IMAGE_REPOSITORY)'
  containerRegistry: '$(CONTAINER_REGISTRY)'
  dockerfilePath: '$(Build.SourcesDirectory)'
  dockerfileName: '$(DOCKERFILE_NAME)'
  tag: '$(Build.BuildId)'
  azureSubscription: '$(AZURE_SUBSCRIPTION)'
  appName: '$(APP_NAME)'
  agentPool: '$(AGENT_POOL)'
  keyVaultName: '$(KEY_VAULT_NAME)'
  acrPassword: '$(ACR_PASSWORD)'
  resourceGroup: '$(RESOURCE_GROUP)'

stages:
  - stage: Build
    displayName: Build and push stage
    jobs:
      - job: Build
        displayName: Build
        pool:
          name: $(agentPool)
          vmImage: 'ubuntu-latest'
        steps:
          - script: docker --version
            displayName: 'Check Docker Version'

          - task: AzureKeyVault@2
            inputs:
              azureSubscription: $(azureSubscription)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: '*'
              RunAsPreJob: false

          - task: CmdLine@2
            inputs:
              script: 'echo $(db-password) > db_password.txt'

          - task: CopyFiles@2
            inputs:
              Contents: db_password.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(storage-account) > storage_account.txt'

          - task: CopyFiles@2
            inputs:
              Contents: storage_account.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(crossref-password) > crossref_password.txt'

          - task: CopyFiles@2
            inputs:
              Contents: crossref_password.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: CmdLine@2
            inputs:
              script: 'echo $(crossref-email) > crossref_email.txt'

          - task: CopyFiles@2
            inputs:
              Contents: crossref_email.txt
              targetFolder: '$(Build.SourcesDirectory)'

          - task: Docker@2
            displayName: Build
            inputs:
              command: 'build'
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              Dockerfile: $(dockerfilePath)/$(dockerfileName)
              tags: $(tag)

          - task: Docker@2
            displayName: Push
            inputs:
              command: push
              repository: $(imageRepository)
              containerRegistry: $(dockerRegistryServiceConnection)
              tags: $(tag)

          - task: AzureCLI@2
            displayName: 'Deploy container to Azure Web App'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                az webapp config container set \
                  --resource-group $(resourceGroup) \
                  --name $(appName) \
                  --container-image-name $(containerRegistry).azurecr.io/$(imageRepository):$(tag) \
                  --container-registry-url https://$(containerRegistry).azurecr.io \
                  --container-registry-user $(containerRegistry) \
                  --container-registry-password $(acrPassword)
              failOnStandardError: false